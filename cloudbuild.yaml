steps:
  # 1. Install dependencies
  - name: "oven/bun:1.4.4-slim"
    entrypoint: "bun"
    args: ["install", "--frozen-lockfile"]

  # 2. Run verification (typecheck + tests + size)
  - name: "oven/bun:1.4.4-slim"
    entrypoint: "bun"
    args: ["run", "verify"]

  # 3. Build Docker container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/breathewise/app:$COMMIT_SHA",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/breathewise/app:latest",
        ".",
      ]

  # 4. Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "--all-tags",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/breathewise/app",
      ]

  # 5. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      [
        "run",
        "deploy",
        "breathewise",
        "--image",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/breathewise/app:$COMMIT_SHA",
        "--region",
        "asia-south1",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--memory",
        "512Mi",
        "--concurrency",
        "40",
      ]

images:
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/breathewise/app:$COMMIT_SHA"
  - "asia-south1-docker.pkg.dev/$PROJECT_ID/breathewise/app:latest"

options:
  logging: CLOUD_LOGGING_ONLY
