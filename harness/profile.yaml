# DO NOT hand-edit without re-running reconcile; changes here cascade to agents, roles, registry.

project_name: BreatheWise
project_type: web-app
languages: [typescript]
frameworks: [nextjs, react]
package_manager: bun
runtime: bun

has_ui: true
has_db: true          # Cloud Firestore (optional history)
has_network_integrations: true   # Google Air Quality API, Open-Meteo, Gemini AI API
handles_sensitive_data: true     # user BYO Gemini key — never logged, never stored server-side
deploy_target: cloud             # Cloud Run + Firebase Hosting

team_mode: solo
ci: github-actions
ide_adapters: [claude, copilot]  # AGENTS.md + CLAUDE.md + .github/copilot-instructions.md

parallelism: 2
sprint_length: by-task

# Role roster — all 11 standard roles enabled; Designer kept (has_ui: true)
# Security is mandatory+blocking (handles_sensitive_data: true)
enabled_roles:
  - orchestrator
  - po-spec
  - designer
  - tech-lead
  - test-author
  - builder
  - reviewer
  - security
  - qa
  - scribe
  - librarian

disabled_roles: []   # none disabled

# Extra gates from profile signals
extra_gates:
  - id: G1-semgrep       # security scan on changed files (has_network_integrations)
    trigger: G1
  - id: G4-a11y          # accessibility check (has_ui)
    trigger: G4
  - id: G2-migration     # DB migration check (has_db)
    trigger: G2

# Sandbox allow-list for network calls
allowed_hosts:
  - registry.npmjs.org
  - bun.sh
  - airquality.googleapis.com
  - air-quality-api.open-meteo.com
  - geocoding-api.open-meteo.com
  - generativelanguage.googleapis.com
  - firestore.googleapis.com
  - firebase.googleapis.com

confidence: 0.95   # high — raw.md is extremely detailed
